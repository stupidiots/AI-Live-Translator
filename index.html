<script>
  function copyNum(num, btn){
    function done(){
      var en = document.documentElement.lang === 'en';
      btn.textContent = en ? 'Copied ✓' : 'Copy ယူပြီးပြီ ✓';
      setTimeout(function(){
        btn.textContent = btn.getAttribute('data-' + (document.documentElement.lang || 'my')) || btn.textContent;
      }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(num).then(done).catch(function(){ fallback(); });
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = num; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta); done();
    }
  }
  function setLang(l){
    document.querySelectorAll('[data-my]').forEach(function(el){
      el.innerHTML = el.getAttribute('data-' + l);
    });
    document.getElementById('btn-my').classList.toggle('active', l === 'my');
    document.getElementById('btn-en').classList.toggle('active', l === 'en');
    document.documentElement.lang = l;
    try{ localStorage.setItem('ailt-lang', l); }catch(e){}
  }
  (function(){
    var saved = 'my';
    try{ saved = localStorage.getItem('ailt-lang') || 'my'; }catch(e){}
    setLang(saved);
  })();
</script>
