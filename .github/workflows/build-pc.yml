name: Build PC version

on:
  workflow_dispatch:
  push:
    paths:
      - "pc/**"
      - ".github/workflows/build-pc.yml"
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements.txt pyinstaller
      - name: Build exe
        working-directory: pc
        run: pyinstaller --onefile --windowed --name AILiveTranslator translator_pc.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AILiveTranslator-PC
          path: pc/dist/AILiveTranslator.exe
